name: Update calendar

on:

  # Allow manual execution from GitHub.
  workflow_dispatch:

  # Run every 15 minutes.
  schedule:
    - cron: "7,22,37,52 * * * *"

  # Also update when the calendar script or workflow changes.
  push:
    paths:
      - "scripts/update_calendar.py"
      - ".github/workflows/update-calendar.yml"


permissions:
  contents: write


jobs:

  update-calendar:

    runs-on: ubuntu-latest


    steps:

      # ------------------------------------------------------
      # Get repository
      # ------------------------------------------------------

      - name: Check out repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------
      #
      # Keep icalendar below version 7 because of compatibility
      # with recurring-ical-events.
      #
      # ------------------------------------------------------

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            "icalendar>=6.1,<7" \
            "recurring-ical-events"


      # ------------------------------------------------------
      # Generate calendar.json
      # ------------------------------------------------------

      - name: Update calendar.json
        run: |

          python scripts/update_calendar.py


      # ------------------------------------------------------
      # Commit only if something changed
      # ------------------------------------------------------

      - name: Commit updated calendar
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add calendar.json


          if git diff --cached --quiet; then

            echo "No calendar changes."

          else

            git commit \
              -m "Update calendar"

            git push

          fi      - name: Download and convert calendars
        run: |
          python scripts/update_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar.json

          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update calendar"
            git push
          fi
