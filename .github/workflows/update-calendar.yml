name: Update Outlook calendars

on:
  workflow_dispatch:

  schedule:
    # Every 15 minutes, at :07, :22, :37 and :52.
    # Using non-round minutes reduces the chance of GitHub Actions delays.
    - cron: "7,22,37,52 * * * *"

  push:
    paths:
      - "scripts/update_calendar.py"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install icalendar

      - name: Download and convert calendars
        run: |
          python scripts/update_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar.json

          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update calendar"
            git push
          fi
