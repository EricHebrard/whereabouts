<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My whereabouts</title>

  <link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css"
    rel="stylesheet"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #calendar {
      width: 100%;
      height: 100vh;
    }

    .fc {
      height: 100%;
      font-size: 14px;
    }

    .fc-toolbar {
      padding: 6px 10px;
      margin-bottom: 0 !important;
    }

    .fc-toolbar-title {
      font-size: 1.2em !important;
    }

    .fc-button {
      font-size: 0.9em !important;
    }

    .fc-event {
      border-width: 0;
      border-radius: 3px;
      padding: 2px 4px;
      cursor: pointer;
    }

    .fc-event-title {
      font-weight: 500;
    }

    /*
     * Event details dialog
     */
    #event-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.45);
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #event-modal.visible {
      display: flex;
    }

    #event-modal-content {
      position: relative;
      width: min(900px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      padding: 24px 28px;
      box-sizing: border-box;
    }

    #event-modal-close {
      position: absolute;
      top: 10px;
      right: 14px;
      border: 0;
      background: transparent;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      color: #666;
    }

    #event-modal-close:hover {
      color: #000;
    }

    #event-modal-title {
      margin: 0 40px 8px 0;
      font-size: 1.5em;
    }

    #event-modal-calendar {
      display: inline-block;
      padding: 3px 8px;
      margin-bottom: 18px;
      border-radius: 4px;
      color: white;
      font-size: 0.85em;
    }

    .event-details {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 8px 16px;
      margin-top: 10px;
    }

    .event-detail-label {
      font-weight: bold;
      color: #555;
    }

    .event-detail-value {
      overflow-wrap: anywhere;
    }

    .event-description {
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .event-detail-value a {
      color: #1565c0;
      text-decoration: underline;
    }

    .event-detail-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #ddd;
    }

    .event-detail-section h3 {
      margin: 0 0 10px;
      font-size: 1em;
    }

    .event-attendees {
      margin: 0;
      padding-left: 20px;
    }

    .event-attendees li {
      margin-bottom: 4px;
    }

    /*
     * Make longer events easier to read.
     */
    .fc-daygrid-event {
      white-space: normal;
    }

    @media (max-width: 700px) {
      .fc-toolbar {
        flex-wrap: wrap;
      }

      .fc-toolbar-title {
        font-size: 1em !important;
      }

      #event-modal {
        padding: 8px;
      }

      #event-modal-content {
        max-height: 95vh;
        padding: 20px;
      }

      .event-details {
        grid-template-columns: 1fr;
        gap: 3px;
      }

      .event-detail-label {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

  <div id="calendar"></div>

  <!-- Event details modal -->
  <div id="event-modal" role="dialog" aria-modal="true" aria-labelledby="event-modal-title">

    <div id="event-modal-content">

      <button
        id="event-modal-close"
        type="button"
        aria-label="Close"
      >
        &times;
      </button>

      <h2 id="event-modal-title"></h2>

      <div id="event-modal-calendar"></div>

      <div id="event-modal-details"></div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {

      const response = await fetch('calendar.json?v=' + Date.now());

      if (!response.ok) {
        throw new Error('Could not load calendar data.');
      }

      const events = await response.json();

      const calendar = new FullCalendar.Calendar(
        document.getElementById('calendar'),
        {
          initialView: 'timeGridWeek',

          firstDay: 1,

          timeZone: 'Europe/London',

          nowIndicator: true,

          height: '100%',

          slotMinTime: '06:00:00',
          slotMaxTime: '23:00:00',

          allDaySlot: true,

          weekends: true,

          expandRows: true,

          eventDisplay: 'block',

          eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          },

          /*
           * Display the title and location in the calendar itself.
           * Clicking the event opens all of the available information.
           */
          eventContent: function(arg) {

            const location = arg.event.extendedProps.location;

            const container = document.createElement('div');

            const title = document.createElement('div');
            title.textContent = arg.event.title;
            title.style.fontWeight = '500';

            container.appendChild(title);

            if (location) {
              const loc = document.createElement('div');

              loc.textContent = location;
              loc.style.fontSize = '0.85em';
              loc.style.opacity = '0.9';
              loc.style.marginTop = '2px';

              container.appendChild(loc);
            }

            return {
              domNodes: [container]
            };
          },

          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'timeGridWeek,dayGridMonth'
          },

          buttonText: {
            today: 'Today',
            week: 'Week',
            month: 'Month'
          },

          events: events,

          /*
           * Clicking an event opens the complete event information.
           */
          eventClick: function(info) {
            info.jsEvent.preventDefault();
            showEventDetails(info.event);
          }
        }
      );

      calendar.render();


      /*
       * ------------------------------------------------------------------
       * Event details modal
       * ------------------------------------------------------------------
       */

      const modal = document.getElementById('event-modal');
      const modalTitle = document.getElementById('event-modal-title');
      const modalCalendar = document.getElementById('event-modal-calendar');
      const modalDetails = document.getElementById('event-modal-details');
      const modalClose = document.getElementById('event-modal-close');


      function escapeHtml(value) {

        if (value === null || value === undefined) {
          return '';
        }

        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }


      function linkify(value) {

        if (!value) {
          return '';
        }

        const escaped = escapeHtml(value);

        return escaped.replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
        );
      }


      function formatDate(date) {

        if (!date) {
          return '';
        }

        return new Intl.DateTimeFormat(
          'en-GB',
          {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            timeZone: 'Europe/London'
          }
        ).format(date);
      }


      function formatDateOnly(date) {

        if (!date) {
          return '';
        }

        return new Intl.DateTimeFormat(
          'en-GB',
          {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric',
            timeZone: 'Europe/London'
          }
        ).format(date);
      }


      function addDetail(label, value, options = {}) {

        if (
          value === null ||
          value === undefined ||
          value === ''
        ) {
          return;
        }

        const row = document.createElement('div');
        row.className = 'event-details';

        const labelElement = document.createElement('div');
        labelElement.className = 'event-detail-label';
        labelElement.textContent = label;

        const valueElement = document.createElement('div');
        valueElement.className = 'event-detail-value';

        if (options.description) {
          valueElement.className += ' event-description';
          valueElement.textContent = value;
        }
        else if (options.url) {
          const link = document.createElement('a');
          link.href = value;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = value;
          valueElement.appendChild(link);
        }
        else {
          valueElement.textContent = value;
        }

        row.appendChild(labelElement);
        row.appendChild(valueElement);

        modalDetails.appendChild(row);
      }


      function showEventDetails(event) {

        const props = event.extendedProps;

        modalTitle.textContent = event.title || 'Untitled event';

        modalCalendar.textContent =
          props.calendar || 'Calendar';

        modalCalendar.style.backgroundColor =
          event.backgroundColor || '#666';


        modalDetails.innerHTML = '';


        /*
         * Date/time
         */
        if (event.allDay) {

          addDetail(
            'Date',
            formatDateOnly(event.start)
          );

          if (event.end) {
            addDetail(
              'End date',
              formatDateOnly(
                new Date(event.end.getTime() - 1)
              )
            );
          }

        } else {

          addDetail(
            'Start',
            formatDate(event.start)
          );

          addDetail(
            'End',
            formatDate(event.end)
          );
        }


        /*
         * Standard Outlook/iCalendar information.
         */
        addDetail(
          'Location',
          props.location
        );

        addDetail(
          'Description',
          props.description,
          { description: true }
        );

        addDetail(
          'URL',
          props.url,
          { url: true }
        );

        addDetail(
          'Status',
          props.status
        );

        addDetail(
          'Transparency',
          props.transparency
        );

        addDetail(
          'Categories',
          Array.isArray(props.categories)
            ? props.categories.join(', ')
            : props.categories
        );

        addDetail(
          'Priority',
          props.priority
        );

        addDetail(
          'Organizer',
          props.organizer
        );


        /*
         * Attendees
         */
        if (
          Array.isArray(props.attendees) &&
          props.attendees.length > 0
        ) {

          const section = document.createElement('div');
          section.className = 'event-detail-section';

          const heading = document.createElement('h3');
          heading.textContent = 'Attendees';

          section.appendChild(heading);

          const list = document.createElement('ul');
          list.className = 'event-attendees';

          props.attendees.forEach(function(attendee) {

            const li = document.createElement('li');

            if (typeof attendee === 'string') {
              li.textContent = attendee;
            } else {

              const name = attendee.name || attendee.email || 'Attendee';

              li.textContent = name;

              const details = [];

              if (attendee.email) {
                details.push(attendee.email);
              }

              if (attendee.role) {
                details.push(attendee.role);
              }

              if (attendee.status) {
                details.push(attendee.status);
              }

              if (details.length) {
                li.textContent +=
                  ' (' + details.join(', ') + ')';
              }
            }

            list.appendChild(li);
          });

          section.appendChild(list);
          modalDetails.appendChild(section);
        }


        /*
         * Additional iCalendar properties.
         *
         * The Python script preserves these in "extra".
         */
        if (
          props.extra &&
          Object.keys(props.extra).length > 0
        ) {

          const section = document.createElement('div');
          section.className = 'event-detail-section';

          const heading = document.createElement('h3');
          heading.textContent = 'Additional information';

          section.appendChild(heading);

          const details = document.createElement('div');
          details.className = 'event-details';

          Object.entries(props.extra).forEach(
            function([key, value]) {

              if (
                value === null ||
                value === undefined ||
                value === ''
              ) {
                return;
              }

              const label = document.createElement('div');
              label.className = 'event-detail-label';
              label.textContent = key;

              const content = document.createElement('div');
              content.className = 'event-detail-value';

              if (Array.isArray(value)) {
                content.textContent =
                  value.join(', ');
              } else if (
                typeof value === 'object'
              ) {
                content.textContent =
                  JSON.stringify(value, null, 2);
              } else {
                content.textContent = value;
              }

              details.appendChild(label);
              details.appendChild(content);
            }
          );

          section.appendChild(details);
          modalDetails.appendChild(section);
        }


        modal.classList.add('visible');
        modalClose.focus();
      }


      function closeModal() {
        modal.classList.remove('visible');
      }


      modalClose.addEventListener(
        'click',
        closeModal
      );


      /*
       * Clicking outside the dialog closes it.
       */
      modal.addEventListener(
        'click',
        function(event) {

          if (event.target === modal) {
            closeModal();
          }
        }
      );


      /*
       * Escape closes the dialog.
       */
      document.addEventListener(
        'keydown',
        function(event) {

          if (
            event.key === 'Escape' &&
            modal.classList.contains('visible')
          ) {
            closeModal();
          }
        }
      );

    });
  </script>

</body>
</html>
