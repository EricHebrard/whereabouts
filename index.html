<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendar</title>

  <link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    body {
      overflow: hidden;
    }

    #calendar {
      width: 100%;
      height: 100vh;
      padding: 10px;
      background: #fff;
    }

    /* =========================================================
       FullCalendar
       ========================================================= */

    .fc {
      height: 100%;
    }

    .fc-toolbar-title {
      font-size: 1.35rem !important;
      font-weight: 600;
    }

    .fc-button {
      border-radius: 5px !important;
    }

    .fc-event {
      cursor: pointer;
      border-width: 1px;
    }

    .fc-event-title {
      font-weight: 500;
    }

    .fc-event-location {
      font-size: 0.78em;
      opacity: 0.85;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================================================
       Event modal
       ========================================================= */

    #event-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.45);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #event-modal.visible {
      display: flex;
    }

    .event-modal-content {
      position: relative;
      width: min(700px, 100%);
      max-height: min(85vh, 900px);
      overflow-y: auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    .event-modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #ddd;
    }

    #event-modal-title {
      margin: 0 45px 12px 0;
      font-size: 1.4rem;
      line-height: 1.3;
    }

    /*
     * Source calendar badge.
     *
     * update_calendar.py creates:
     *
     * extendedProps: {
     *   calendar: calendar_name,
     *   color: calendar_color,
     *   ...
     * }
     *
     * Therefore this displays the source calendar directly.
     */

    #event-modal-calendar {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.2;
      background: #666;
    }

    .event-modal-close {
      position: absolute;
      top: 15px;
      right: 18px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #555;
      font-size: 26px;
      line-height: 30px;
      cursor: pointer;
    }

    .event-modal-close:hover {
      background: #eee;
      color: #111;
    }

    #event-modal-details {
      padding: 18px 24px 24px;
    }

    .event-detail {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    .event-detail:last-child {
      border-bottom: 0;
    }

    .event-detail-label {
      color: #666;
      font-weight: 600;
    }

    .event-detail-value {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      #calendar {
        padding: 4px;
      }

      .fc-toolbar {
        flex-wrap: wrap;
        gap: 6px;
      }

      .fc-toolbar-title {
        font-size: 1.1rem !important;
      }

      .event-modal-content {
        max-height: 92vh;
      }

      .event-detail {
        grid-template-columns: 1fr;
        gap: 3px;
      }

      .event-detail-label {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>

  <div id="calendar"></div>

  <!-- =========================================================
       Event details modal
       ========================================================= -->

  <div
    id="event-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="event-modal-title"
  >

    <div class="event-modal-content">

      <div class="event-modal-header">

        <button
          type="button"
          class="event-modal-close"
          id="event-modal-close"
          aria-label="Close"
        >
          &times;
        </button>

        <h2 id="event-modal-title">Event</h2>

        <!-- Source calendar: Academics / Research / Teaching / Travel -->
        <span id="event-modal-calendar">Calendar</span>

      </div>

      <div id="event-modal-details"></div>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const calendarEl =
        document.getElementById("calendar");

      const modal =
        document.getElementById("event-modal");

      const modalTitle =
        document.getElementById("event-modal-title");

      const modalCalendar =
        document.getElementById("event-modal-calendar");

      const modalDetails =
        document.getElementById("event-modal-details");

      const modalClose =
        document.getElementById("event-modal-close");


      /* =======================================================
         Add a single detail row
         ======================================================= */

      function addDetail(label, value) {

        if (
          value === null ||
          value === undefined ||
          String(value).trim() === ""
        ) {
          return;
        }

        const row =
          document.createElement("div");

        row.className =
          "event-detail";

        const labelEl =
          document.createElement("div");

        labelEl.className =
          "event-detail-label";

        labelEl.textContent =
          label;

        const valueEl =
          document.createElement("div");

        valueEl.className =
          "event-detail-value";

        valueEl.textContent =
          String(value);

        row.appendChild(labelEl);
        row.appendChild(valueEl);

        modalDetails.appendChild(row);
      }


      /* =======================================================
         Format event date/time
         ======================================================= */

      function formatEventDate(event) {

        const start = event.start;
        const end = event.end;

        if (!start) {
          return "";
        }

        const dateFormatter =
          new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/London",
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric"
          });

        const timeFormatter =
          new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/London",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          });


        /*
         * All-day events
         */

        if (event.allDay) {

          const startDate =
            new Date(start);

          if (!end) {
            return dateFormatter.format(startDate);
          }

          const endDate =
            new Date(end);

          /*
           * FullCalendar treats an all-day event's
           * end date as exclusive.
           *
           * If the event lasts one day, display
           * only the start date.
           */

          if (
            endDate.getTime() -
            startDate.getTime() <=
            24 * 60 * 60 * 1000
          ) {
            return dateFormatter.format(startDate);
          }

          const displayEnd =
            new Date(endDate);

          displayEnd.setDate(
            displayEnd.getDate() - 1
          );

          return (
            dateFormatter.format(startDate) +
            " – " +
            dateFormatter.format(displayEnd)
          );
        }


        /*
         * Timed events
         */

        const startDate =
          new Date(start);

        let result =
          dateFormatter.format(startDate) +
          " " +
          timeFormatter.format(startDate);


        if (end) {

          const endDate =
            new Date(end);

          const sameDate =
            dateFormatter.format(startDate) ===
            dateFormatter.format(endDate);

          if (sameDate) {

            result +=
              " – " +
              timeFormatter.format(endDate);

          } else {

            result +=
              " – " +
              dateFormatter.format(endDate) +
              " " +
              timeFormatter.format(endDate);
          }
        }

        return result;
      }


      /* =======================================================
         Show event details
         
         IMPORTANT:
         Only Calendar, When and Location are displayed.
         ======================================================= */

      function showEventDetails(event) {

        const props =
          event.extendedProps || {};


        /*
         * Event title
         */

        modalTitle.textContent =
          event.title || "Untitled event";


        /*
         * Source calendar
         *
         * Supplied by update_calendar.py as:
         *
         * extendedProps.calendar
         */

        const calendarName =
          props.calendar || "Calendar";

        modalCalendar.textContent =
          calendarName;


        /*
         * Use the source calendar's colour.
         */

        modalCalendar.style.backgroundColor =
          props.color ||
          event.backgroundColor ||
          "#666";


        /*
         * Remove any details from a previous event.
         */

        modalDetails.innerHTML = "";


        /*
         * ONLY these two detail fields are shown.
         *
         * The calendar/source is displayed above
         * as the coloured badge.
         */

        addDetail(
          "When",
          formatEventDate(event)
        );

        addDetail(
          "Location",
          props.location
        );


        /*
         * Open the modal.
         */

        modal.classList.add("visible");
      }


      /* =======================================================
         Close modal
         ======================================================= */

      function closeEventDetails() {

        modal.classList.remove("visible");
      }


      /*
       * Close button
       */

      modalClose.addEventListener(
        "click",
        closeEventDetails
      );


      /*
       * Close when clicking outside modal content
       */

      modal.addEventListener(
        "click",
        function (event) {

          if (event.target === modal) {
            closeEventDetails();
          }
        }
      );


      /*
       * Close with Escape
       */

      document.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Escape" &&
            modal.classList.contains("visible")
          ) {
            closeEventDetails();
          }
        }
      );


      /* =======================================================
         Load calendar.json
         
         This file is generated by:
         
         scripts/update_calendar.py
         
         The cache-busting query parameter ensures that
         GitHub Pages does not unnecessarily serve an old
         copy of calendar.json.
         ======================================================= */

      fetch(
        "calendar.json?v=" +
        Date.now()
      )
        .then(function (response) {

          if (!response.ok) {

            throw new Error(
              "Unable to load calendar.json: " +
              response.status
            );
          }

          return response.json();
        })

        .then(function (events) {


          /* =================================================
             Initialise FullCalendar
             ================================================= */

          const calendar =
            new FullCalendar.Calendar(
              calendarEl,
              {

                initialView:
                  "timeGridWeek",

                firstDay:
                  1,

                timeZone:
                  "Europe/London",

                nowIndicator:
                  true,

                height:
                  "100%",

                expandRows:
                  true,

                slotMinTime:
                  "06:00:00",

                slotMaxTime:
                  "23:00:00",

                allDaySlot:
                  true,

                weekends:
                  true,

                eventDisplay:
                  "block",


                /*
                 * Event time format
                 */

                eventTimeFormat: {
                  hour: "2-digit",
                  minute: "2-digit",
                  hour12: false
                },


                /*
                 * Toolbar
                 */

                headerToolbar: {
                  left:
                    "prev,next today",

                  center:
                    "title",

                  right:
                    "timeGridWeek,dayGridMonth"
                },


                buttonText: {
                  today:
                    "Today",

                  week:
                    "Week",

                  month:
                    "Month"
                },


                /*
                 * Events generated by update_calendar.py
                 */

                events:
                  events,


                /* =============================================
                   Event appearance
                   ============================================= */

                eventContent:
                  function (arg) {

                    const wrapper =
                      document.createElement("div");


                    /*
                     * Event title
                     */

                    const title =
                      document.createElement("div");

                    title.className =
                      "fc-event-title";

                    title.textContent =
                      arg.event.title || "";

                    wrapper.appendChild(title);


                    /*
                     * Location displayed inside
                     * the calendar event itself.
                     */

                    const location =
                      arg.event.extendedProps &&
                      arg.event.extendedProps.location;

                    if (location) {

                      const locationEl =
                        document.createElement("div");

                      locationEl.className =
                        "fc-event-location";

                      locationEl.textContent =
                        location;

                      wrapper.appendChild(
                        locationEl
                      );
                    }


                    return {
                      domNodes: [wrapper]
                    };
                  },


                /* =============================================
                   Event click
                   ============================================= */

                eventClick:
                  function (info) {

                    /*
                     * Prevent the browser following
                     * the event's URL.
                     */

                    info.jsEvent.preventDefault();

                    showEventDetails(
                      info.event
                    );
                  },


                /* =============================================
                   Event tooltip
                   ============================================= */

                eventDidMount:
                  function (info) {

                    const props =
                      info.event.extendedProps ||
                      {};

                    const parts = [];


                    if (info.event.title) {

                      parts.push(
                        info.event.title
                      );
                    }


                    if (props.calendar) {

                      parts.push(
                        "Calendar: " +
                        props.calendar
                      );
                    }


                    if (props.location) {

                      parts.push(
                        "Location: " +
                        props.location
                      );
                    }


                    if (parts.length) {

                      info.el.title =
                        parts.join("\n");
                    }
                  }
              }
            );


          /*
           * Render calendar
           */

          calendar.render();
        })


        /* =====================================================
           Error handling
           ===================================================== */

        .catch(function (error) {

          console.error(
            "Calendar loading error:",
            error
          );

          calendarEl.innerHTML =
            "<div style=\"" +
            "padding:30px;" +
            "font-family:sans-serif;" +
            "color:#b00020;" +
            "\">" +

            "<strong>" +
            "Unable to load calendar." +
            "</strong>" +

            "<br><br>" +

            error.message +

            "</div>";
        });

    });
  </script>

</body>
</html>
