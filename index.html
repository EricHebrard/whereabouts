<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My whereabouts</title>

    <link
        href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        #calendar {
            height: 100vh;
        }

        /* ==================================================
           EVENT MODAL
           ================================================== */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            align-items: center;
            justify-content: center;
        }

        .modal.visible {
            display: flex;
        }

        .modal-content {
            position: relative;
            background: white;
            width: min(600px, calc(100% - 40px));
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            border-radius: 10px;
            padding: 28px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            border: none;
            background: transparent;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
            color: #666;
        }

        .modal-close:hover {
            color: #000;
        }

        #modal-title {
            margin: 0 40px 24px 0;
            font-size: 1.35rem;
            font-weight: 600;
        }

        .detail-row {
            margin-bottom: 20px;
        }

        .detail-label {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .detail-value {
            line-height: 1.5;
            color: #333;
        }

        .description {
            white-space: normal;
        }

        /* ==================================================
           RESPONSIVE MODAL
           ================================================== */

        @media (max-width: 600px) {

            .modal-content {
                width: calc(100% - 20px);
                max-height: calc(100vh - 20px);
                padding: 22px;
            }

            #modal-title {
                font-size: 1.2rem;
            }

        }

    </style>
</head>

<body>

    <div id="calendar"></div>


    <!-- ==================================================
         EVENT DETAILS MODAL
         ================================================== -->

    <div
        id="event-modal"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >

            <button
                id="modal-close"
                class="modal-close"
                aria-label="Close"
            >
                &times;
            </button>

            <h2 id="modal-title"></h2>

            <div id="modal-body"></div>

        </div>

    </div>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                const calendarEl =
                    document.getElementById(
                        "calendar"
                    );

                const modal =
                    document.getElementById(
                        "event-modal"
                    );

                const modalTitle =
                    document.getElementById(
                        "modal-title"
                    );

                const modalBody =
                    document.getElementById(
                        "modal-body"
                    );

                const modalClose =
                    document.getElementById(
                        "modal-close"
                    );


                // ==================================================
                // ESCAPE HTML
                // ==================================================

                function escapeHtml(value) {

                    if (
                        value === null ||
                        value === undefined
                    ) {
                        return "";
                    }

                    return String(value)
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );
                }


                // ==================================================
                // FORMAT DATE
                // ==================================================

                function formatDate(date) {

                    return date.toLocaleDateString(
                        "en-GB",
                        {
                            weekday: "long",
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    );
                }


                // ==================================================
                // FORMAT TIME
                // ==================================================

                function formatTime(date) {

                    return date.toLocaleTimeString(
                        "en-GB",
                        {
                            hour: "2-digit",
                            minute: "2-digit",
                            hour12: false
                        }
                    );
                }


                // ==================================================
                // FORMAT EVENT TIME
                // ==================================================

                function formatEventTime(event) {

                    const start = event.start;
                    const end = event.end;

                    if (!start) {
                        return "";
                    }


                    // All-day event
                    if (event.allDay) {

                        if (end) {

                            const endDate =
                                new Date(end);

                            endDate.setDate(
                                endDate.getDate() - 1
                            );

                            return (
                                formatDate(start)
                                +
                                " – "
                                +
                                formatDate(endDate)
                            );
                        }

                        return formatDate(start);
                    }


                    // Timed event
                    const dateText =
                        formatDate(start);

                    const startTime =
                        formatTime(start);

                    if (end) {

                        const endTime =
                            formatTime(end);

                        return (
                            dateText
                            +
                            ", "
                            +
                            startTime
                            +
                            " – "
                            +
                            endTime
                        );
                    }

                    return (
                        dateText
                        +
                        ", "
                        +
                        startTime
                    );
                }


                // ==================================================
                // FORMAT DESCRIPTION
                // ==================================================

                function formatDescription(
                    description
                ) {

                    return escapeHtml(
                        description
                    )
                        .replace(
                            /\r\n/g,
                            "<br>"
                        )
                        .replace(
                            /\n/g,
                            "<br>"
                        )
                        .replace(
                            /\r/g,
                            "<br>"
                        );
                }


                // ==================================================
                // OPEN MODAL
                // ==================================================

                function openModal(event) {

                    const props =
                        event.extendedProps;


                    modalTitle.textContent =
                        event.title;


                    let html = "";


                    // ------------------------------------------------
                    // TIME
                    // ------------------------------------------------

                    html += `
                        <div class="detail-row">
                            <div class="detail-label">
                                Time
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(
                                    formatEventTime(event)
                                )}
                            </div>
                        </div>
                    `;


                    // ------------------------------------------------
                    // LOCATION
                    // ------------------------------------------------

                    if (
                        props.location &&
                        props.location.trim()
                    ) {

                        html += `
                            <div class="detail-row">
                                <div class="detail-label">
                                    Location
                                </div>

                                <div class="detail-value">
                                    ${escapeHtml(
                                        props.location
                                    )}
                                </div>
                            </div>
                        `;
                    }


                    // ------------------------------------------------
                    // DESCRIPTION
                    // ------------------------------------------------

                    if (
                        props.description &&
                        props.description.trim()
                    ) {

                        html += `
                            <div class="detail-row">
                                <div class="detail-label">
                                    Description
                                </div>

                                <div class="detail-value description">
                                    ${formatDescription(
                                        props.description
                                    )}
                                </div>
                            </div>
                        `;
                    }


                    modalBody.innerHTML =
                        html;


                    modal.classList.add(
                        "visible"
                    );

                    modal.setAttribute(
                        "aria-hidden",
                        "false"
                    );
                }


                // ==================================================
                // CLOSE MODAL
                // ==================================================

                function closeModal() {

                    modal.classList.remove(
                        "visible"
                    );

                    modal.setAttribute(
                        "aria-hidden",
                        "true"
                    );
                }


                // ==================================================
                // CLOSE BUTTON
                // ==================================================

                modalClose.addEventListener(
                    "click",
                    closeModal
                );


                // ==================================================
                // CLICK OUTSIDE MODAL
                // ==================================================

                modal.addEventListener(
                    "click",
                    function(event) {

                        if (
                            event.target === modal
                        ) {

                            closeModal();
                        }
                    }
                );


                // ==================================================
                // ESCAPE KEY
                // ==================================================

                document.addEventListener(
                    "keydown",
                    function(event) {

                        if (
                            event.key === "Escape"
                        ) {

                            closeModal();
                        }
                    }
                );


                // ==================================================
                // FULLCALENDAR
                // ==================================================

                const calendar =
                    new FullCalendar.Calendar(
                        calendarEl,
                        {

                            initialView:
                                "timeGridWeek",

                            firstDay: 1,

                            timeZone:
                                "Europe/London",

                            nowIndicator:
                                true,

                            slotMinTime:
                                "06:00:00",

                            slotMaxTime:
                                "23:00:00",

                            allDaySlot:
                                true,

                            weekends:
                                true,

                            expandRows:
                                true,

                            headerToolbar: {

                                left:
                                    "prev,next today",

                                center:
                                    "title",

                                right:
                                    "timeGridWeek,dayGridMonth"
                            },


                            // ------------------------------------------------
                            // LOAD EVENTS
                            // ------------------------------------------------

                            events:
                                "calendar.json?v="
                                +
                                Date.now(),


                            // ------------------------------------------------
                            // EVENT DISPLAY
                            // ------------------------------------------------

                            eventDisplay:
                                "block",


                            // ------------------------------------------------
                            // EVENT CLICK
                            // ------------------------------------------------

                            eventClick:
                                function(info) {

                                    info.jsEvent.preventDefault();

                                    openModal(
                                        info.event
                                    );
                                },


                            // ------------------------------------------------
                            // EVENT TOOLTIP
                            // ------------------------------------------------

                            eventDidMount:
                                function(info) {

                                    const location =
                                        info.event
                                            .extendedProps
                                            .location;

                                    if (
                                        location
                                    ) {

                                        info.el.title =
                                            location;
                                    }
                                }

                        }
                    );


                calendar.render();

            }
        );

    </script>

</body>
</html>
